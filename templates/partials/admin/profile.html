<div class="admin-card">
    <h3>Profile Photo</h3>
    <p>Update your profile picture directly from dashboard.</p>

    <div class="photo-upload-box">
        <img id="profilePhotoPreview"
             src="/static/uploads/profile.jpeg"
             alt="Profile Preview">

        <input type="file"
               id="profilePhotoInput"
               accept="image/png,image/jpeg,image/webp"
               hidden>

        <button type="button"
                onclick="document.getElementById('profilePhotoInput').click()">
            Choose Photo
        </button>

        <button type="button" id="uploadPhotoBtn">
            Save Photo
        </button>

        <p id="photoUploadStatus"></p>
    </div>
</div>

        <section id="profile" class="admin-section">
          <div class="section-head">
            <div>
              <p class="admin-eyebrow">PERSONAL INFORMATION</p>
              <h2>Profile</h2>
            </div>
          </div>

          <form id="profileForm" class="admin-form">
            <label>
              Name
              <input name="name" required />
            </label>

            <label>
              Role
              <input name="role" />
            </label>

            <label>
              Location
              <input name="location" />
            </label>

            <label>
              Email
              <input name="email" type="email" />
            </label>

            <label class="full">
              Bio
              <textarea name="bio" rows="3"></textarea>
            </label>

            <label class="full">
              About
              <textarea name="about" rows="5"></textarea>
            </label>

            <button class="primary-btn" type="submit">Save profile</button>
          </form>
        </section>
